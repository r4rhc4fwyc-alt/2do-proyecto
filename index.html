<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Generador de sigilos</title>
<style>
:root {
  --bg: #0b0d14;
  --panel: #12151f;
  --border: #262b3a;
  --text: #e7e9f0;
  --muted: #8a90a6;
  --accent: #c9a24b;
  --accent-dim: rgba(201, 162, 75, 0.35);
  --danger: #d16464;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* evita que el navegador haga scroll/bounce mientras se dibuja en el canvas */
  overscroll-behavior: none;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

h1 {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 4px;
  letter-spacing: 0.02em;
}

.subtitle {
  color: var(--muted);
  font-size: 0.85rem;
  margin: 0 0 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 8px;
}

textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  background: #0d1018;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  padding: 10px;
  font-family: inherit;
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  font-family: inherit;
  font-size: 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #1a1e2b;
  color: var(--text);
  padding: 10px 14px;
  cursor: pointer;
}

button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1608;
  font-weight: 600;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-select {
  display: flex;
  gap: 10px;
}

.mode-option {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: #0d1018;
}

.mode-option.active {
  border-color: var(--accent);
  background: rgba(201, 162, 75, 0.08);
}

.mode-option input {
  margin-top: 3px;
}

.mode-option .label {
  font-size: 0.85rem;
  font-weight: 600;
}

.mode-option .desc {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}

.letters-readout {
  font-size: 0.95rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  min-height: 1.2em;
}

.letters-readout .empty {
  color: var(--muted);
  letter-spacing: normal;
  font-style: italic;
}

.canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: #0d1018;
  border: 1px solid var(--border);
  touch-action: none;
}

.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#drawCanvas {
  cursor: crosshair;
}

.hint {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 10px;
  text-align: center;
}
</style>
</head>
<body>
<div class="app">
  <h1>Generador de sigilos</h1>
  <p class="subtitle">Escribe una frase o intención, redúcela a su forma simbólica y trázala.</p>

  <div class="panel">
    <label for="phraseInput">Frase o intención</label>
    <textarea id="phraseInput" placeholder="Ej: Confío en mi propio criterio"></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="generateBtn" class="primary">Generar sigilo</button>
    </div>
  </div>

  <div class="panel">
    <label>Letras reducidas</label>
    <div id="lettersReadout" class="letters-readout"><span class="empty">— genera un sigilo para ver las letras —</span></div>
  </div>

  <div class="panel">
    <label>Modo de trazo</label>
    <div class="mode-select">
      <label class="mode-option" id="modeGuiadoOption">
        <input type="radio" name="mode" value="guiado" checked>
        <span>
          <span class="label">Guiado</span>
          <span class="desc">Puntos numerados y línea tenue de referencia.</span>
        </span>
      </label>
      <label class="mode-option" id="modeLibreOption">
        <input type="radio" name="mode" value="libre">
        <span>
          <span class="label">Libre</span>
          <span class="desc">Solo los puntos como referencia, tú trazas.</span>
        </span>
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="bgCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
    <p class="hint" id="hintText">Genera un sigilo para empezar a trazar.</p>
    <div class="row" style="margin-top:10px;">
      <button id="clearStrokeBtn">Limpiar trazo</button>
      <button id="resetBtn">Reiniciar todo</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// 1. ALFABETO Y ALGORITMO DE REDUCCIÓN
// ---------------------------------------------------------------

// Las 27 letras del alfabeto español (RAE), en orden, con la Ñ
// como letra propia entre la N y la O.
const ALPHABET = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Ñ',
                   'O','P','Q','R','S','T','U','V','W','X','Y','Z'];

const VOWELS = new Set(['A', 'E', 'I', 'O', 'U']);

// Convierte una frase en la secuencia de consonantes únicas que
// forman el sigilo, en el orden en que aparecen.
function reduceToSigil(text) {
  // 1) Mayúsculas.
  let s = text.toUpperCase();

  // 2) Quitar tildes SIN tocar la Ñ.
  //    normalize('NFD') separa "É" en "E" + acento combinante, lo cual
  //    nos permite borrar el acento con una regex. El problema es que
  //    también separaría "Ñ" en "N" + tilde combinante, y perderíamos
  //    la diferencia entre N y Ñ. Por eso la protegemos primero con un
  //    carácter que no va a aparecer nunca en el texto normal.
  const GUARD = '\u0000';
  s = s.replace(/Ñ/g, GUARD);
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); // quita acentos
  s = s.replace(new RegExp(GUARD, 'g'), 'Ñ');

  // 3) Quedarnos solo con letras válidas (descarta espacios, números,
  //    signos de puntuación, etc).
  s = s.replace(/[^A-ZÑ]/g, '');

  // 4) Quitar las vocales.
  const consonants = [...s].filter(ch => !VOWELS.has(ch));

  // 5) De las consonantes que quedan, conservar solo la primera
  //    aparición de cada una.
  const seen = new Set();
  const result = [];
  for (const ch of consonants) {
    if (!seen.has(ch)) {
      seen.add(ch);
      result.push(ch);
    }
  }
  return result;
}
</script>
</body>
</html>
