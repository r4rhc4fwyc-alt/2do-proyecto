<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Generador de sigilos</title>
<style>
:root {
  --bg: #0b0d14;
  --panel: #12151f;
  --border: #262b3a;
  --text: #e7e9f0;
  --muted: #8a90a6;
  --accent: #c9a24b;
  --accent-dim: rgba(201, 162, 75, 0.35);
  --danger: #d16464;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* evita que el navegador haga scroll/bounce mientras se dibuja en el canvas */
  overscroll-behavior: none;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

h1 {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 4px;
  letter-spacing: 0.02em;
}

.subtitle {
  color: var(--muted);
  font-size: 0.85rem;
  margin: 0 0 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 8px;
}

textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  background: #0d1018;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  padding: 10px;
  font-family: inherit;
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  font-family: inherit;
  font-size: 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #1a1e2b;
  color: var(--text);
  padding: 10px 14px;
  cursor: pointer;
}

button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1608;
  font-weight: 600;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

button[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

input[type="range"]:disabled {
  opacity: 0.4;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-select {
  display: flex;
  gap: 10px;
}

.mode-option {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: #0d1018;
}

.mode-option.active {
  border-color: var(--accent);
  background: rgba(201, 162, 75, 0.08);
}

.mode-option input {
  margin-top: 3px;
}

.mode-option .label {
  font-size: 0.85rem;
  font-weight: 600;
}

.mode-option .desc {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}

.letters-readout {
  font-size: 0.95rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  min-height: 1.2em;
}

.letters-readout .empty {
  color: var(--muted);
  letter-spacing: normal;
  font-style: italic;
}

.canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: #0d1018;
  border: 1px solid var(--border);
  touch-action: none;
}

.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#drawCanvas {
  cursor: crosshair;
}

.hint {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 10px;
  text-align: center;
}

.live-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.live-card {
  background: #0d1018;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.live-card canvas {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  cursor: zoom-in;
}

.live-card button {
  width: 100%;
  border: none;
  border-top: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 8px;
}

.live-card button:hover {
  color: var(--danger);
}

.live-empty {
  font-size: 0.8rem;
  color: var(--muted);
  font-style: italic;
  margin: 12px 0 0;
  text-align: center;
}

.live-overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #05060a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}

.live-overlay[hidden] {
  display: none;
}

.live-overlay canvas {
  width: min(92vw, 88vh);
  aspect-ratio: 1 / 1;
}

.live-overlay p {
  font-size: 0.75rem;
  color: #3a3f52;
  margin: 12px 0 0;
}
</style>
</head>
<body>
<div class="app">
  <h1>Generador de sigilos</h1>
  <p class="subtitle">Escribe una frase o intención, redúcela a su forma simbólica y trázala.</p>

  <div class="panel">
    <label for="phraseInput">Frase o intención</label>
    <textarea id="phraseInput" placeholder="Ej: Confío en mi propio criterio" autocomplete="off" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="generateBtn" class="primary">Generar sigilo</button>
    </div>
  </div>

  <div class="panel">
    <label>Letras reducidas</label>
    <div id="lettersReadout" class="letters-readout"><span class="empty">— genera un sigilo para ver las letras —</span></div>
  </div>

  <div class="panel">
    <label>Geometría</label>
    <div class="mode-select">
      <label class="mode-option" id="geometryRuedaOption">
        <input type="radio" name="geometry" value="rueda" checked>
        <span>
          <span class="label">Rueda</span>
          <span class="desc">Las 27 letras distribuidas en círculo.</span>
        </span>
      </label>
      <label class="mode-option" id="geometryKameaOption">
        <input type="radio" name="geometry" value="kamea">
        <span>
          <span class="label">Kamea</span>
          <span class="desc">Cuadrado mágico de Mercurio, 8×8.</span>
        </span>
      </label>
    </div>
  </div>

  <div class="panel">
    <label>Modo de trazo</label>
    <div class="mode-select">
      <label class="mode-option" id="modeGuiadoOption">
        <input type="radio" name="mode" value="guiado" checked>
        <span>
          <span class="label">Guiado</span>
          <span class="desc">Puntos numerados y línea tenue de referencia.</span>
        </span>
      </label>
      <label class="mode-option" id="modeLibreOption">
        <input type="radio" name="mode" value="libre">
        <span>
          <span class="label">Libre</span>
          <span class="desc">Solo los puntos como referencia, tú trazas.</span>
        </span>
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="bgCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
    <p class="hint" id="hintText">Genera un sigilo para empezar a trazar.</p>
    <div class="row" style="margin-top:10px;">
      <button id="revealBtn" style="display:none;">Visualizar sigilo</button>
      <button id="undoBtn" disabled>Deshacer</button>
      <button id="clearStrokeBtn">Limpiar trazo</button>
      <button id="resetBtn">Reiniciar todo</button>
    </div>
  </div>

  <div class="panel">
    <label for="rotationSlider">Girar sigilo (<span id="rotationValue">0</span>°)</label>
    <input type="range" id="rotationSlider" min="0" max="359" step="1" value="0" disabled>
    <div class="row" style="margin-top:10px;">
      <button id="flipHBtn" disabled>Invertir horizontal</button>
      <button id="flipVBtn" disabled>Invertir vertical</button>
      <button id="resetTransformBtn" disabled>Restablecer giro</button>
    </div>
  </div>

  <div class="panel">
    <label>Sigilos vivos</label>
    <div class="row">
      <button id="sowBtn" class="primary" disabled>Sembrar sigilo</button>
    </div>
    <p class="hint" style="text-align:left;">Al sembrarlo, el trazo se cierra y empieza a crecer. La frase se olvida.</p>
    <div class="live-grid" id="liveGrid"></div>
    <p class="live-empty" id="liveEmpty">Aún no hay sigilos vivos.</p>
  </div>
</div>

<div class="live-overlay" id="liveOverlay" hidden>
  <canvas id="overlayCanvas"></canvas>
  <p>Toca para cerrar</p>
</div>

<script>
// ---------------------------------------------------------------
// 1. ALFABETO Y ALGORITMO DE REDUCCIÓN
// ---------------------------------------------------------------

// Las 27 letras del alfabeto español (RAE), en orden, con la Ñ
// como letra propia entre la N y la O.
const ALPHABET = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Ñ',
                   'O','P','Q','R','S','T','U','V','W','X','Y','Z'];

const VOWELS = new Set(['A', 'E', 'I', 'O', 'U']);

// Convierte una frase en la secuencia de consonantes únicas que
// forman el sigilo, en el orden en que aparecen.
function reduceToSigil(text) {
  // 1) Mayúsculas.
  let s = text.toUpperCase();

  // 2) Quitar tildes SIN tocar la Ñ.
  //    normalize('NFD') separa "É" en "E" + acento combinante, lo cual
  //    nos permite borrar el acento con una regex. El problema es que
  //    también separaría "Ñ" en "N" + tilde combinante, y perderíamos
  //    la diferencia entre N y Ñ. Por eso la protegemos primero con un
  //    carácter que no va a aparecer nunca en el texto normal.
  const GUARD = '\u0000';
  s = s.replace(/Ñ/g, GUARD);
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); // quita acentos
  s = s.replace(new RegExp(GUARD, 'g'), 'Ñ');

  // 3) Quedarnos solo con letras válidas (descarta espacios, números,
  //    signos de puntuación, etc).
  s = s.replace(/[^A-ZÑ]/g, '');

  // 4) Quitar las vocales.
  const consonants = [...s].filter(ch => !VOWELS.has(ch));

  // 5) De las consonantes que quedan, conservar solo la primera
  //    aparición de cada una.
  const seen = new Set();
  const result = [];
  for (const ch of consonants) {
    if (!seen.has(ch)) {
      seen.add(ch);
      result.push(ch);
    }
  }
  return result;
}

// ---------------------------------------------------------------
// 2. GEOMETRÍA DE LA RUEDA
// ---------------------------------------------------------------

// Elementos y estado del canvas. Los canvases son cuadrados y su
// tamaño en píxeles reales se recalcula en resizeCanvases() para que
// se vean nítidos también en pantallas de alta densidad (Retina/iPad).
const canvasWrap = document.getElementById('canvasWrap');
const bgCanvas = document.getElementById('bgCanvas');
const drawCanvas = document.getElementById('drawCanvas');
const bgCtx = bgCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

let wheelCenter = { x: 0, y: 0 };
let wheelRadius = 0;
let letterPositions = {}; // { 'A': {x, y}, 'B': {x, y}, ... }
let currentLetters = [];  // resultado de reduceToSigil(), letras en orden

// Ajusta la resolución interna del canvas a su tamaño real en
// pantalla * devicePixelRatio, para que las líneas no se vean
// borrosas en pantallas retina. Sin esto, un canvas de 300x300 CSS
// pero dibujado a 300x300 px reales se ve pixelado en un iPad.
function resizeCanvases() {
  const size = canvasWrap.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  [bgCanvas, drawCanvas].forEach(canvas => {
    canvas.width = size * dpr;
    canvas.height = size * dpr;
  });
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  wheelCenter = { x: size / 2, y: size / 2 };
  wheelRadius = size * 0.38;
  letterPositions = computeLetterPositions(wheelCenter, wheelRadius);
}

// Distribuye las 27 letras en círculo, empezando por A en la parte
// superior (las 12 en punto) y avanzando en sentido horario.
//
// Cada letra guarda dos coordenadas distintas:
//   - point: el punto exacto SOBRE el círculo. Es el que se usa para
//     el sigilo (líneas, numeración, trazo de referencia).
//   - label: un poco más afuera del círculo. Es solo para que el
//     texto de la letra no tape su propio punto.
function computeLetterPositions(center, radius) {
  const positions = {};
  const n = ALPHABET.length;
  const labelRadius = radius + 20;
  ALPHABET.forEach((letter, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    positions[letter] = {
      point: {
        x: center.x + radius * Math.cos(angle),
        y: center.y + radius * Math.sin(angle),
      },
      label: {
        x: center.x + labelRadius * Math.cos(angle),
        y: center.y + labelRadius * Math.sin(angle),
      },
    };
  });
  return positions;
}

// Dibuja el fondo: el círculo guía, las 27 letras del alfabeto, y
// (si ya hay un sigilo generado) los puntos que le corresponden,
// con numeración y línea tenue solo cuando el modo es "guiado".
function drawBackground() {
  // Geometría kamea: se dibuja aparte y no se toca nada de lo que
  // sigue, que es exclusivamente el dibujo de la rueda.
  if (getSelectedGeometry() === 'kamea') {
    drawKameaBackground();
    return;
  }

  const size = canvasWrap.clientWidth;
  bgCtx.clearRect(0, 0, size, size);

  // Círculo guía.
  bgCtx.beginPath();
  bgCtx.arc(wheelCenter.x, wheelCenter.y, wheelRadius, 0, Math.PI * 2);
  bgCtx.strokeStyle = '#262b3a';
  bgCtx.lineWidth = 1;
  bgCtx.stroke();

  // Las 27 letras, como referencia de fondo.
  bgCtx.font = '13px -apple-system, sans-serif';
  bgCtx.textAlign = 'center';
  bgCtx.textBaseline = 'middle';
  ALPHABET.forEach(letter => {
    const { point, label } = letterPositions[letter];
    // Con "Visualizar sigilo" activo, tratamos la rueda como si
    // ningún punto estuviera marcado: así desaparece el resaltado
    // dorado y solo queda tu trazo (que vive en el otro canvas).
    const isActive = !sigilRevealed && currentLetters.includes(letter);

    // Etiqueta con el nombre de la letra, un poco afuera del círculo.
    bgCtx.fillStyle = isActive ? '#c9a24b' : '#4a5066';
    bgCtx.fillText(letter, label.x, label.y);

    // Punto exacto sobre el círculo: es la posición real que usa el sigilo.
    bgCtx.beginPath();
    bgCtx.arc(point.x, point.y, isActive ? 3.5 : 1.5, 0, Math.PI * 2);
    bgCtx.fillStyle = isActive ? '#c9a24b' : '#333a4d';
    bgCtx.fill();
  });

  if (currentLetters.length === 0) return;

  const mode = getSelectedMode();

  if (mode === 'guiado' && !sigilRevealed) {
    // Línea tenue conectando los puntos en el orden de la reducción.
    bgCtx.beginPath();
    currentLetters.forEach((letter, i) => {
      const { point } = letterPositions[letter];
      if (i === 0) bgCtx.moveTo(point.x, point.y);
      else bgCtx.lineTo(point.x, point.y);
    });
    bgCtx.strokeStyle = 'rgba(201, 162, 75, 0.35)';
    bgCtx.lineWidth = 1.5;
    bgCtx.stroke();

    // Número de orden junto a cada punto.
    currentLetters.forEach((letter, i) => {
      const { point } = letterPositions[letter];
      bgCtx.fillStyle = '#e7e9f0';
      bgCtx.font = '11px -apple-system, sans-serif';
      bgCtx.fillText(String(i + 1), point.x + 10, point.y - 10);
    });
  }
  // En modo "libre" no se dibuja línea ni números: los puntos
  // (ya marcados arriba como isActive) quedan como única referencia.
}

// ---------------------------------------------------------------
// 2.5. GEOMETRÍA KAMEA (cuadrado mágico de Mercurio, 8×8)
// ---------------------------------------------------------------
// Segunda geometría, alternativa a la rueda. Esta sección es
// completamente independiente de la rueda de arriba (no la toca ni
// reutiliza sus funciones): calcula y dibuja su propia grilla. Lo
// único que conecta ambas es drawBackground(), que más abajo decide
// cuál de las dos llamar según la geometría elegida.

// El kamea clásico de Mercurio de la tradición hermética: un
// cuadrado mágico 8×8 con los números 1 a 64, donde cada fila,
// columna y diagonal suma 260 (la "constante mágica" de Mercurio).
const KAMEA_LAYOUT = [
  [8, 58, 59, 5, 4, 62, 63, 1],
  [49, 15, 14, 52, 53, 11, 10, 56],
  [41, 23, 22, 44, 45, 19, 18, 48],
  [32, 34, 35, 29, 28, 38, 39, 25],
  [40, 26, 27, 37, 36, 30, 31, 33],
  [17, 47, 46, 20, 21, 43, 42, 24],
  [9, 55, 54, 12, 13, 51, 50, 16],
  [64, 2, 3, 61, 60, 6, 7, 57],
];

// Índice inverso: dado un número del 1 al 64, en qué fila/columna
// de la grilla está.
const KAMEA_CELL_OF_NUMBER = {};
KAMEA_LAYOUT.forEach((row, r) => {
  row.forEach((num, c) => {
    KAMEA_CELL_OF_NUMBER[num] = { row: r, col: c };
  });
});

// La misma posición alfabética que ya usa la rueda para repartir las
// letras en el círculo (A=1, B=2, ... Ñ en su lugar, ... Z=27) es,
// en el kamea, directamente el número de celda de esa letra.
const ALPHA_INDEX = {};
ALPHABET.forEach((letter, i) => { ALPHA_INDEX[letter] = i + 1; });

function getSelectedGeometry() {
  return document.querySelector('input[name="geometry"]:checked').value;
}

// Dibuja la grilla de 64 celdas con sus números, resalta las que
// corresponden a letras del sigilo actual y, en modo guiado (sin
// "Visualizar sigilo" activo), conecta esas celdas en orden con una
// línea tenue y numeración — el mismo lenguaje visual que la rueda,
// pero sobre la grilla del kamea.
function drawKameaBackground() {
  const size = canvasWrap.clientWidth;
  bgCtx.clearRect(0, 0, size, size);

  const gridSize = size * 0.86;
  const cellSize = gridSize / 8;
  const origin = (size - gridSize) / 2;

  function cellCenter(num) {
    const cell = KAMEA_CELL_OF_NUMBER[num];
    return {
      x: origin + cell.col * cellSize + cellSize / 2,
      y: origin + cell.row * cellSize + cellSize / 2,
    };
  }

  // Qué números están "activos" (forman parte del sigilo actual).
  // Con "Visualizar sigilo" puesto, tratamos la grilla como si no
  // hubiera ninguno activo, igual que hace la rueda.
  const activeLetterOfNumber = {};
  if (!sigilRevealed) {
    currentLetters.forEach(letter => {
      activeLetterOfNumber[ALPHA_INDEX[letter]] = letter;
    });
  }

  // Fondo resaltado de las celdas activas, dibujado antes que las
  // líneas de la grilla para que el borde quede nítido encima.
  for (let num = 1; num <= 64; num++) {
    if (!activeLetterOfNumber[num]) continue;
    const cell = KAMEA_CELL_OF_NUMBER[num];
    bgCtx.fillStyle = 'rgba(201, 162, 75, 0.15)';
    bgCtx.fillRect(origin + cell.col * cellSize, origin + cell.row * cellSize, cellSize, cellSize);
  }

  // Líneas de la grilla (9 líneas verticales + 9 horizontales para 8x8 celdas).
  bgCtx.strokeStyle = '#262b3a';
  bgCtx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) {
    const x = origin + i * cellSize;
    bgCtx.beginPath();
    bgCtx.moveTo(x, origin);
    bgCtx.lineTo(x, origin + gridSize);
    bgCtx.stroke();
    const y = origin + i * cellSize;
    bgCtx.beginPath();
    bgCtx.moveTo(origin, y);
    bgCtx.lineTo(origin + gridSize, y);
    bgCtx.stroke();
  }

  // Los 64 números, uno por celda.
  bgCtx.textAlign = 'center';
  bgCtx.textBaseline = 'middle';
  bgCtx.font = `${Math.max(10, cellSize * 0.28)}px -apple-system, sans-serif`;
  for (let num = 1; num <= 64; num++) {
    const isActive = Boolean(activeLetterOfNumber[num]);
    const p = cellCenter(num);
    bgCtx.fillStyle = isActive ? '#c9a24b' : '#4a5066';
    bgCtx.fillText(String(num), p.x, p.y);
  }

  if (currentLetters.length === 0) return;

  if (getSelectedMode() === 'guiado' && !sigilRevealed) {
    // Línea tenue conectando las celdas en el orden de la reducción.
    bgCtx.beginPath();
    currentLetters.forEach((letter, i) => {
      const p = cellCenter(ALPHA_INDEX[letter]);
      if (i === 0) bgCtx.moveTo(p.x, p.y);
      else bgCtx.lineTo(p.x, p.y);
    });
    bgCtx.strokeStyle = 'rgba(201, 162, 75, 0.35)';
    bgCtx.lineWidth = 1.5;
    bgCtx.stroke();

    // Número de orden junto a cada celda activa.
    currentLetters.forEach((letter, i) => {
      const p = cellCenter(ALPHA_INDEX[letter]);
      bgCtx.fillStyle = '#e7e9f0';
      bgCtx.font = '11px -apple-system, sans-serif';
      bgCtx.fillText(String(i + 1), p.x + cellSize * 0.32, p.y - cellSize * 0.32);
    });
  }
  // En modo "libre" no se dibuja línea ni números: las celdas activas
  // (ya resaltadas arriba) quedan como única referencia.
}

// ---------------------------------------------------------------
// 3. CONTROLES: generar sigilo, elegir modo, limpiar
// ---------------------------------------------------------------

const phraseInput = document.getElementById('phraseInput');
const generateBtn = document.getElementById('generateBtn');
const lettersReadout = document.getElementById('lettersReadout');
const modeInputs = document.querySelectorAll('input[name="mode"]');
const modeGuiadoOption = document.getElementById('modeGuiadoOption');
const modeLibreOption = document.getElementById('modeLibreOption');
const geometryInputs = document.querySelectorAll('input[name="geometry"]');
const geometryRuedaOption = document.getElementById('geometryRuedaOption');
const geometryKameaOption = document.getElementById('geometryKameaOption');
const revealBtn = document.getElementById('revealBtn');
const undoBtn = document.getElementById('undoBtn');
const clearStrokeBtn = document.getElementById('clearStrokeBtn');
const resetBtn = document.getElementById('resetBtn');
const hintText = document.getElementById('hintText');
const rotationSlider = document.getElementById('rotationSlider');
const rotationValue = document.getElementById('rotationValue');
const flipHBtn = document.getElementById('flipHBtn');
const flipVBtn = document.getElementById('flipVBtn');
const resetTransformBtn = document.getElementById('resetTransformBtn');
const sowBtn = document.getElementById('sowBtn');

// Construyen un juego de trazos/transforms "vacío", con una entrada
// por modo. Se usan tanto para el estado inicial como para resetear
// todo al generar un sigilo nuevo.
function emptyModeStrokes() {
  return { guiado: [], libre: [] };
}
function emptyModeTransforms() {
  return {
    guiado: { angle: 0, flipH: false, flipV: false },
    libre: { angle: 0, flipH: false, flipV: false },
  };
}

// Ajuste estético del sigilo YA DIBUJADO: girarlo y/o invertirlo.
// Cada combinación de GEOMETRÍA + MODO tiene el suyo propio, igual
// que sus trazos (ver más abajo). Los puntos que guardamos en
// strokesByGeoMode NUNCA cambian por esto: el ángulo y las
// inversiones se aplican solo al momento de dibujar en pantalla (ver
// applyTransform/redrawStrokes), así que mover el control es
// no-destructivo y se puede deshacer volviendo a 0°.
let transformByGeoMode = {
  rueda: emptyModeTransforms(),
  kamea: emptyModeTransforms(),
};

function currentTransform() {
  return transformByGeoMode[getSelectedGeometry()][getSelectedMode()];
}

// Convierte un punto "tal como se guardó" (sin rotar) en la posición
// donde debe dibujarse en pantalla, aplicando el giro/inversión
// actuales alrededor del centro de la rueda.
function applyTransform(point, t) {
  let dx = point.x - wheelCenter.x;
  let dy = point.y - wheelCenter.y;
  if (t.flipH) dx = -dx;
  if (t.flipV) dy = -dy;
  const rad = (t.angle * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  return {
    x: wheelCenter.x + (dx * cos - dy * sin),
    y: wheelCenter.y + (dx * sin + dy * cos),
  };
}

// La operación inversa: dado un punto tal como aparece en pantalla
// (donde tocaste con el dedo), calcula qué punto "sin rotar" hay que
// guardar para que, al aplicarle el giro actual, vuelva a caer
// exactamente donde tocaste. Así, si ya rotaste el sigilo y seguís
// dibujando, el trazo nuevo aparece bajo tu dedo sin saltos ni
// duplicar la rotación.
function inverseTransform(point, t) {
  let dx = point.x - wheelCenter.x;
  let dy = point.y - wheelCenter.y;
  const rad = (-t.angle * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  let rx = dx * cos - dy * sin;
  let ry = dx * sin + dy * cos;
  if (t.flipH) rx = -rx;
  if (t.flipV) ry = -ry;
  return { x: wheelCenter.x + rx, y: wheelCenter.y + ry };
}

// true mientras el usuario pidió "ver el sigilo limpio": oculta el
// resaltado de puntos, la numeración y la línea guía en la rueda de
// fondo. Solo tiene sentido en modo guiado (en libre nunca se
// dibujan esos elementos, así que no hay nada que ocultar).
let sigilRevealed = false;

// Cada combinación de GEOMETRÍA (rueda/kamea) y MODO (guiado/libre)
// tiene su propio historial de trazos, totalmente independiente de
// las otras tres. Así podés ir y venir entre cualquiera de las 4
// combinaciones para comparar cómo queda el sigilo, sin que cambiar
// de geometría o de modo borre nada: simplemente mostramos el
// "cajón" de trazos que le corresponde a la combinación activa. Cada
// trazo es una lista de puntos NORMALIZADOS (fracción 0–1 del ancho
// del canvas, no píxeles absolutos) — así, si cambia el tamaño del
// canvas (por ejemplo al redimensionar la ventana), el trazo se
// reescala solo en vez de quedar desalineado.
let strokesByGeoMode = {
  rueda: emptyModeStrokes(),
  kamea: emptyModeStrokes(),
};

function currentStrokes() {
  return strokesByGeoMode[getSelectedGeometry()][getSelectedMode()];
}

// También habilita "Sembrar sigilo": ambos dependen de lo mismo (que
// haya algún trazo en el cajón activo) y se actualizan en los mismos
// momentos.
function updateUndoButton() {
  undoBtn.disabled = currentStrokes().length === 0;
  sowBtn.disabled = currentStrokes().length === 0;
}

// Los controles de giro/inversión solo tienen sentido si hay algo
// dibujado en el modo activo. Además de habilitarlos/deshabilitarlos,
// sincroniza el slider y el estado visual de los botones con el
// transform guardado para ESTE modo (importante al cambiar de modo:
// cada uno recuerda su propio giro).
function updateTransformControls() {
  const hasStrokes = currentStrokes().length > 0;
  const t = currentTransform();
  rotationSlider.disabled = !hasStrokes;
  flipHBtn.disabled = !hasStrokes;
  flipVBtn.disabled = !hasStrokes;
  resetTransformBtn.disabled = !hasStrokes;
  rotationSlider.value = t.angle;
  rotationValue.textContent = t.angle;
  flipHBtn.setAttribute('aria-pressed', String(t.flipH));
  flipVBtn.setAttribute('aria-pressed', String(t.flipV));
}

// El botón "Visualizar sigilo" solo aparece en modo guiado y una vez
// que hay un sigilo generado (en libre no hay nada que "limpiar": la
// rueda ya se muestra sin números ni línea).
function updateRevealButton() {
  const showButton = getSelectedMode() === 'guiado' && currentLetters.length > 0;
  revealBtn.style.display = showButton ? '' : 'none';
  revealBtn.textContent = sigilRevealed ? 'Mostrar guía' : 'Visualizar sigilo';
  revealBtn.setAttribute('aria-pressed', String(sigilRevealed));
}

function getSelectedMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function updateModeOptionStyles() {
  const mode = getSelectedMode();
  modeGuiadoOption.classList.toggle('active', mode === 'guiado');
  modeLibreOption.classList.toggle('active', mode === 'libre');
}

function updateGeometryOptionStyles() {
  const geometry = getSelectedGeometry();
  geometryRuedaOption.classList.toggle('active', geometry === 'rueda');
  geometryKameaOption.classList.toggle('active', geometry === 'kamea');
}

function renderLettersReadout() {
  if (currentLetters.length === 0) {
    lettersReadout.innerHTML = '<span class="empty">— genera un sigilo para ver las letras —</span>';
  } else {
    lettersReadout.textContent = currentLetters.join(' · ');
  }
}

function generateSigil() {
  // Sin frase no hay nada que generar, y no queremos que un toque
  // accidental en "Generar" (con el campo ya vacío, ver abajo) borre
  // un trazo a medio hacer.
  if (!phraseInput.value.trim()) {
    hintText.textContent = 'Escribe una frase para generar el sigilo.';
    return;
  }
  currentLetters = reduceToSigil(phraseInput.value);
  // La frase se usa UNA sola vez, aquí, y se descarta en el acto: no
  // queda en el campo, ni en ninguna variable, ni en el almacenamiento.
  // Solo sobreviven las consonantes reducidas (necesarias para guiar
  // el trazo), y también esas se olvidan al sembrar el sigilo.
  phraseInput.value = '';
  // Un sigilo nuevo cambia por completo el significado de lo
  // dibujado: los trazos viejos, en cualquier combinación de
  // geometría y modo, ya no corresponderían a nada.
  strokesByGeoMode = { rueda: emptyModeStrokes(), kamea: emptyModeStrokes() };
  transformByGeoMode = { rueda: emptyModeTransforms(), kamea: emptyModeTransforms() };
  sigilRevealed = false;
  clearDrawing();
  updateUndoButton();
  updateRevealButton();
  updateTransformControls();
  renderLettersReadout();
  drawBackground();
  hintText.textContent = currentLetters.length
    ? 'Traza el sigilo con el dedo o el lápiz sobre el canvas.'
    : 'La frase no produjo ninguna consonante utilizable. Prueba con otra.';
}

// Borra solo lo que se ve en el canvas de dibujo. No toca
// `strokesByGeoMode`: quien llama decide si también hay que olvidar
// el historial.
function clearDrawing() {
  const size = canvasWrap.clientWidth;
  drawCtx.clearRect(0, 0, size, size);
}

// Vuelve a pintar, desde cero, los trazos guardados del modo activo.
// Se usa al deshacer y al cambiar de modo, para que el dibujo en
// pantalla siempre coincida con el historial de "este" modo.
function redrawStrokes() {
  clearDrawing();
  const t = currentTransform();
  currentStrokes().forEach(rawPoints => {
    if (rawPoints.length < 2) return;
    // rawPoints está en coordenadas normalizadas (0–1): primero lo
    // escalamos al tamaño actual del canvas, y recién ahí aplicamos
    // el giro/inversión (que trabaja en píxeles).
    const points = rawPoints.map(p => applyTransform(toPixelPoint(p), t));
    drawCtx.beginPath();
    drawCtx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      drawCtx.lineTo(points[i].x, points[i].y);
    }
    drawCtx.strokeStyle = '#e7e9f0';
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.stroke();
  });
}

generateBtn.addEventListener('click', generateSigil);

modeInputs.forEach(input => {
  input.addEventListener('change', () => {
    updateModeOptionStyles();
    // Al cambiar de modo volvemos a mostrar la guía por defecto en
    // guiado, y repintamos el trazo guardado de ESE modo con SU
    // PROPIO giro/inversión (el del otro modo queda intacto,
    // esperando a que vuelvas).
    sigilRevealed = false;
    updateRevealButton();
    updateUndoButton();
    updateTransformControls();
    redrawStrokes();
    drawBackground();
  });
});

// Igual que el modo, cambiar de geometría ya no borra nada: cada
// combinación geometría+modo tiene su propio cajón de trazos (ver
// strokesByGeoMode), así que esto solo cambia qué cajón se muestra.
geometryInputs.forEach(input => {
  input.addEventListener('change', () => {
    updateGeometryOptionStyles();
    sigilRevealed = false;
    updateRevealButton();
    updateUndoButton();
    updateTransformControls();
    redrawStrokes();
    drawBackground();
  });
});

revealBtn.addEventListener('click', () => {
  sigilRevealed = !sigilRevealed;
  updateRevealButton();
  drawBackground();
});

undoBtn.addEventListener('click', () => {
  const strokes = currentStrokes();
  if (strokes.length === 0) return;
  strokes.pop();
  redrawStrokes();
  updateUndoButton();
});

clearStrokeBtn.addEventListener('click', () => {
  strokesByGeoMode[getSelectedGeometry()][getSelectedMode()] = [];
  transformByGeoMode[getSelectedGeometry()][getSelectedMode()] = { angle: 0, flipH: false, flipV: false };
  clearDrawing();
  updateUndoButton();
  updateTransformControls();
});

// Vuelve el generador a cero: sin frase, sin letras, sin trazos. Lo
// usa "Reiniciar todo" y también el sembrado de un sigilo, que es el
// momento en que las letras (lo último que quedaba de la frase) se
// olvidan.
function resetAll() {
  phraseInput.value = '';
  currentLetters = [];
  strokesByGeoMode = { rueda: emptyModeStrokes(), kamea: emptyModeStrokes() };
  transformByGeoMode = { rueda: emptyModeTransforms(), kamea: emptyModeTransforms() };
  sigilRevealed = false;
  clearDrawing();
  updateUndoButton();
  updateRevealButton();
  updateTransformControls();
  renderLettersReadout();
  drawBackground();
  hintText.textContent = 'Genera un sigilo para empezar a trazar.';
}

resetBtn.addEventListener('click', resetAll);

rotationSlider.addEventListener('input', () => {
  currentTransform().angle = Number(rotationSlider.value);
  rotationValue.textContent = rotationSlider.value;
  redrawStrokes();
});

flipHBtn.addEventListener('click', () => {
  const t = currentTransform();
  t.flipH = !t.flipH;
  updateTransformControls();
  redrawStrokes();
});

flipVBtn.addEventListener('click', () => {
  const t = currentTransform();
  t.flipV = !t.flipV;
  updateTransformControls();
  redrawStrokes();
});

resetTransformBtn.addEventListener('click', () => {
  transformByGeoMode[getSelectedGeometry()][getSelectedMode()] = { angle: 0, flipH: false, flipV: false };
  updateTransformControls();
  redrawStrokes();
});

updateModeOptionStyles();
updateGeometryOptionStyles();
updateRevealButton();
updateTransformControls();

// ---------------------------------------------------------------
// 4. DIBUJO A MANO: Pointer Events (mouse, dedo y lápiz)
// ---------------------------------------------------------------

let isDrawing = false;
let lastPoint = null;
let currentStrokePoints = null; // puntos del trazo que se está dibujando ahora mismo

// Convierte las coordenadas del evento (relativas a la ventana) a
// coordenadas relativas al canvas.
function pointerToCanvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

// El canvas es siempre cuadrado (mismo ancho y alto), así que basta
// una sola división/multiplicación por su tamaño actual para pasar
// de píxeles a una fracción 0–1 (y viceversa) sin deformar el trazo.
// Guardar en la forma normalizada es lo que hace que un trazo
// sobreviva a un cambio de tamaño del canvas: al redibujar, se vuelve
// a escalar con el tamaño ACTUAL en vez de quedar con coordenadas de
// un tamaño que ya no existe.
function toNormalizedPoint(p) {
  const size = canvasWrap.clientWidth;
  return { x: p.x / size, y: p.y / size };
}
function toPixelPoint(p) {
  const size = canvasWrap.clientWidth;
  return { x: p.x * size, y: p.y * size };
}

drawCanvas.addEventListener('pointerdown', (e) => {
  if (currentLetters.length === 0) return; // nada que trazar todavía

  isDrawing = true;

  // Captura el puntero: los siguientes eventos "move"/"up" llegan a
  // este elemento aunque el dedo se salga del canvas, evitando
  // trazos que se cortan en el borde.
  drawCanvas.setPointerCapture(e.pointerId);

  // Dibujamos SIEMPRE en la posición real donde está el dedo (lastPoint,
  // sin transformar): así el trazo aparece exactamente bajo tu dedo,
  // esté o no rotado/invertido el sigilo en este momento. Pero lo que
  // GUARDAMOS en currentStrokePoints es la posición "canónica"
  // (sin el giro actual) Y normalizada (fracción 0–1, no píxeles).
  // Canónica evita que la rotación se "duplique"; normalizada evita
  // que un cambio de tamaño del canvas desalinee el trazo.
  lastPoint = pointerToCanvasPos(e);
  currentStrokePoints = [toNormalizedPoint(inverseTransform(lastPoint, currentTransform()))];
  e.preventDefault();
});

drawCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing) return;

  // Fundamental para iPad/Safari: sin esto, el navegador puede
  // interpretar el arrastre como un gesto de scroll o navegación
  // aunque touch-action:none ya esté puesto en el CSS.
  e.preventDefault();

  const point = pointerToCanvasPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(lastPoint.x, lastPoint.y);
  drawCtx.lineTo(point.x, point.y);
  drawCtx.strokeStyle = '#e7e9f0';
  drawCtx.lineWidth = 3;
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.stroke();
  lastPoint = point;
  currentStrokePoints.push(toNormalizedPoint(inverseTransform(point, currentTransform())));
});

function stopDrawing(e) {
  if (!isDrawing) return;
  isDrawing = false;
  lastPoint = null;

  // Guardamos el trazo completo en el cajón del modo activo para que
  // "Deshacer" pueda quitarlo más tarde. Un solo punto (un toque sin
  // arrastrar) no dibuja ninguna línea, así que no vale la pena
  // guardarlo.
  if (currentStrokePoints && currentStrokePoints.length > 1) {
    currentStrokes().push(currentStrokePoints);
    updateUndoButton();
    updateTransformControls();
  }
  currentStrokePoints = null;
}

drawCanvas.addEventListener('pointerup', stopDrawing);
drawCanvas.addEventListener('pointercancel', stopDrawing);
drawCanvas.addEventListener('pointerleave', stopDrawing);

// ---------------------------------------------------------------
// 4.5. HIPERSIGILO: sigilos vivos que maduran con el tiempo real
// ---------------------------------------------------------------
// Un sigilo sembrado deja de ser editable y pasa a esta sección,
// donde "vive": crece despacio (ligado a la hora real de su
// nacimiento) y pulsa/titila rápido mientras la página está abierta.
//
// Lo único que se guarda de cada sigilo es:
//   - id:     identificador aleatorio sin significado (ej. "x7k2p9"),
//             solo para que el código distinga sus registros. Nunca
//             se muestra.
//   - bornAt: la hora exacta de nacimiento (ms desde 1970).
//   - strokes: la forma ya trazada, en coordenadas normalizadas 0–1.
// Ni la frase ni las letras reducidas se guardan jamás.

const STORAGE_KEY = 'hipersigilos.v1';
const MATURATION_MS = 8 * 60 * 60 * 1000; // ventana de maduración: 8 h
const GROWTH_AMOUNT = 0.30;               // a las 8 h: +30% de largo en ramas
const PULSE_PERIOD = 2.2;                 // segundos por latido

// --- Azar reproducible ---------------------------------------------
// El árbol de ramas NO se guarda: se recalcula cada vez a partir del
// id del sigilo, que funciona como semilla. Con la misma semilla, el
// generador devuelve siempre la misma secuencia de números, así que
// un sigilo crece siempre hacia la misma forma final, sin importar
// cuántas veces se abra la app.
function hashString(str) {
  let h = 2166136261 >>> 0; // FNV-1a
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randomId() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}

// --- Almacenamiento ------------------------------------------------

let liveSigils = [];

function isValidRecord(r) {
  return r && typeof r.id === 'string' && typeof r.bornAt === 'number' &&
    Array.isArray(r.strokes) && r.strokes.length > 0;
}

function loadLiveSigils() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(parsed) ? parsed.filter(isValidRecord) : [];
  } catch (err) {
    return [];
  }
}

function saveLiveSigils() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(liveSigils));
    return true;
  } catch (err) {
    return false;
  }
}

// Cuánto maduró un sigilo, de 0 (recién nacido) a 1 (8 h o más). Se
// calcula siempre desde la hora de nacimiento: no hace falta que la
// app haya estado abierta entretanto. Al reabrirla, el sigilo aparece
// directamente en el punto que le corresponde, y a partir de 1 se
// queda congelado.
function maturity(record, now) {
  return Math.max(0, Math.min(1, (now - record.bornAt) / MATURATION_MS));
}

// --- Geometría de polilíneas ---------------------------------------

function measurePolyline(points) {
  const cum = [0];
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i - 1].x;
    const dy = points[i].y - points[i - 1].y;
    cum.push(cum[i - 1] + Math.hypot(dx, dy));
  }
  return { points, cum, total: cum[cum.length - 1] };
}

// Punto situado a una distancia `s` a lo largo de la polilínea.
function samplePoint(poly, s) {
  const { points, cum, total } = poly;
  s = Math.max(0, Math.min(total, s));
  let i = 1;
  while (i < points.length - 1 && cum[i] < s) i++;
  const a = points[i - 1];
  const b = points[i];
  const seg = cum[i] - cum[i - 1];
  const f = seg > 0 ? (s - cum[i - 1]) / seg : 0;
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
}

// Dirección de la polilínea en `s`. Se mide entre dos puntos algo
// separados (y no en un solo segmento) porque un trazo a mano alzada
// está lleno de micro-segmentos temblorosos que darían una dirección
// casi aleatoria.
function tangentAt(poly, s) {
  const d = 0.015;
  const a = samplePoint(poly, s - d);
  const b = samplePoint(poly, s + d);
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function angleDiff(a, b) {
  return Math.atan2(Math.sin(a - b), Math.cos(a - b));
}

// --- Ramificación --------------------------------------------------
// Convierte la forma de un sigilo en un "modelo de crecimiento": su
// trazo original intacto más un árbol de ramas que brotan de él.
//
// Cómo se decide la forma final (progreso = 1):
//   1. Se reparten brotes primarios a lo largo del trazo (de 2 a 5,
//      según su largo), de manera estratificada para que no se
//      amontonen, saliendo más o menos perpendiculares a la línea.
//   2. Cada rama primaria echa 2 ramas secundarias, y éstas 0–1
//      terciaria, cada vez más cortas y abiertas en ángulo.
//   3. El largo sumado de TODAS las ramas se escala para que sea
//      exactamente el 30% del largo del trazo original: esa es la
//      "transformación máxima".
//   4. Cada rama se dibuja como una curva que se tuerce levemente a
//      cada paso (un paseo aleatorio del ángulo), lo que le da el
//      aire orgánico; si se acerca al borde, se curva hacia adentro.
//
// Cómo se interpola en el tiempo (progreso 0 → 1):
//   Cada rama tiene su propia ventana [start, end] dentro de 0–1. Las
//   primarias brotan escalonadas en el primer 30%; una hija empieza
//   cuando su madre alcanza el punto donde nace. Las ramas que tienen
//   hijas terminan de crecer antes (para dar tiempo a las hijas), y
//   las hojas terminan justo en 1. Así, a las 8 h todo el árbol está
//   completo a la vez, y en cualquier instante intermedio se dibuja
//   cada rama hasta el largo que le toca.
function buildGrowthModel(record) {
  const rand = mulberry32(hashString(record.id));
  const strokes = record.strokes.map(measurePolyline).filter(p => p.total > 0);
  const totalLen = strokes.reduce((sum, p) => sum + p.total, 0);
  const model = { strokes, branches: [], sparkles: [], pulsePhase: rand() * Math.PI * 2 };
  if (totalLen === 0) return model;

  // 1–2. Esqueleto abstracto: posiciones, ángulos y largos RELATIVOS.
  const specs = [];
  function addBranch(spec) {
    specs.push(spec);
    const index = specs.length - 1;
    if (spec.depth >= 2) return;
    const count = spec.depth === 0 ? 2 : (rand() < 0.5 ? 1 : 0);
    const firstSide = rand() < 0.5 ? 1 : -1;
    for (let c = 0; c < count; c++) {
      const side = c % 2 === 0 ? firstSide : -firstSide;
      addBranch({
        parent: index,
        depth: spec.depth + 1,
        attach: 0.3 + rand() * 0.55,
        turn: side * (0.35 + rand() * 0.45),
        relLen: spec.relLen * (0.4 + rand() * 0.25),
        curl: (rand() - 0.5) * 0.06,
      });
    }
  }

  // Pocas ramas y largas: el 30% repartido entre muchas daría matas
  // diminutas que no se leen como ramificación.
  const nPrimary = Math.max(2, Math.min(5, Math.round(totalLen / 0.8)));
  for (let i = 0; i < nPrimary; i++) {
    let rest = ((i + 0.15 + rand() * 0.7) / nPrimary) * totalLen;
    let poly = strokes[strokes.length - 1];
    for (const p of strokes) {
      if (rest <= p.total) { poly = p; break; }
      rest -= p.total;
    }
    const pos = samplePoint(poly, rest);
    const side = rand() < 0.5 ? 1 : -1;
    addBranch({
      parent: -1,
      depth: 0,
      x: pos.x,
      y: pos.y,
      angle: tangentAt(poly, rest) + side * (Math.PI / 2 + (rand() - 0.5) * 0.9),
      relLen: 0.7 + rand() * 0.6,
      curl: (rand() - 0.5) * 0.08,
      start: rand() * 0.3,
    });
  }

  // 3. Escala: suma de largos de ramas = 30% del largo del trazo.
  const totalRel = specs.reduce((sum, s) => sum + s.relLen, 0);
  const k = (totalLen * GROWTH_AMOUNT) / totalRel;

  // 4. Geometría concreta de cada rama, en el mismo orden del
  //    esqueleto (una madre siempre aparece antes que sus hijas).
  const STEP = 0.006;
  specs.forEach((spec, index) => {
    const length = spec.relLen * k;
    let x, y, angle, start;
    if (spec.parent < 0) {
      ({ x, y, angle, start } = spec);
    } else {
      const parent = model.branches[spec.parent];
      const along = spec.attach * parent.poly.total;
      ({ x, y } = samplePoint(parent.poly, along));
      angle = tangentAt(parent.poly, along) + spec.turn;
      start = parent.start + spec.attach * (parent.end - parent.start);
    }
    const isLeaf = !specs.some(s => s.parent === index);
    const end = start + (1 - start) * (isLeaf ? 1 : 0.7);

    const steps = Math.max(3, Math.ceil(length / STEP));
    const stepLen = length / steps;
    const points = [{ x, y }];
    for (let i = 0; i < steps; i++) {
      angle += spec.curl + (rand() - 0.5) * 0.12;
      let nx = x + Math.cos(angle) * stepLen;
      let ny = y + Math.sin(angle) * stepLen;
      if (nx < 0.04 || nx > 0.96 || ny < 0.04 || ny > 0.96) {
        const toCenter = Math.atan2(0.5 - y, 0.5 - x);
        angle += angleDiff(toCenter, angle) * 0.4;
        nx = x + Math.cos(angle) * stepLen;
        ny = y + Math.sin(angle) * stepLen;
      }
      x = Math.max(0.01, Math.min(0.99, nx));
      y = Math.max(0.01, Math.min(0.99, ny));
      points.push({ x, y });
    }
    model.branches.push({ depth: spec.depth, start, end, isLeaf, poly: measurePolyline(points) });
  });

  // Destellos: algunos fijos sobre el trazo original y uno en la
  // punta de cada hoja (que solo aparece cuando esa rama ya creció).
  const nStrokeSparkles = 4 + nPrimary;
  for (let i = 0; i < nStrokeSparkles; i++) {
    let rest = rand() * totalLen;
    let poly = strokes[strokes.length - 1];
    for (const p of strokes) {
      if (rest <= p.total) { poly = p; break; }
      rest -= p.total;
    }
    model.sparkles.push({ point: samplePoint(poly, rest), phase: rand() * Math.PI * 2, speed: 1.6 + rand() * 2.4 });
  }
  model.branches.forEach((b, i) => {
    if (b.isLeaf) model.sparkles.push({ branch: i, phase: rand() * Math.PI * 2, speed: 1.6 + rand() * 2.4 });
  });

  return model;
}

// Qué fracción de su largo tiene una rama en un progreso dado. La
// curva suave (smoothstep) hace que cada rama arranque y termine de
// crecer con delicadeza, en vez de a velocidad constante.
function branchGrowth(branch, progress) {
  const span = branch.end - branch.start;
  const g = span > 0 ? Math.max(0, Math.min(1, (progress - branch.start) / span)) : (progress >= branch.end ? 1 : 0);
  return g * g * (3 - 2 * g);
}

// --- Dibujo --------------------------------------------------------

// Traza (sin pintar) una polilínea normalizada hasta el largo
// `upTo`, en píxeles de un canvas de lado `size`. Devuelve la punta.
function tracePolyline(ctx, poly, upTo, size) {
  const { points, cum } = poly;
  ctx.beginPath();
  ctx.moveTo(points[0].x * size, points[0].y * size);
  let tip = points[0];
  for (let i = 1; i < points.length; i++) {
    if (cum[i] <= upTo) {
      tip = points[i];
    } else {
      tip = samplePoint(poly, upTo);
      ctx.lineTo(tip.x * size, tip.y * size);
      break;
    }
    ctx.lineTo(tip.x * size, tip.y * size);
  }
  return tip;
}

// Dos ritmos, bien separados:
//   - progress (0–1): el crecimiento, ligado a las 8 h reales.
//   - time (segundos de reloj de animación): el pulso y el titileo,
//     rápidos, que solo dicen "está vivo" y no dependen de la edad.
function drawLiveSigil(ctx, size, model, progress, time) {
  ctx.clearRect(0, 0, size, size);
  const scale = size / 500;
  const pulse = 0.5 + 0.5 * Math.sin((time * 2 * Math.PI) / PULSE_PERIOD + model.pulsePhase);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Ramas (debajo del trazo original).
  const branchWidths = [2.2, 1.5, 1];
  const tips = [];
  ctx.shadowColor = 'rgba(201, 162, 75, 0.8)';
  ctx.shadowBlur = (2 + 6 * pulse) * scale;
  ctx.strokeStyle = `rgba(201, 162, 75, ${0.55 + 0.3 * pulse})`;
  model.branches.forEach((b, i) => {
    const grown = branchGrowth(b, progress);
    tips[i] = null;
    if (grown <= 0) return;
    tips[i] = tracePolyline(ctx, b.poly, grown * b.poly.total, size);
    ctx.lineWidth = Math.max(0.6, branchWidths[b.depth] * scale);
    ctx.stroke();
    // Brote luminoso en la punta mientras la rama sigue creciendo.
    if (grown < 1) {
      ctx.beginPath();
      ctx.arc(tips[i].x * size, tips[i].y * size, Math.max(1, 2 * scale), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240, 215, 150, 0.9)';
      ctx.fill();
    }
  });

  // Trazo original: el corazón del sigilo, el que más late.
  ctx.shadowColor = 'rgba(231, 205, 140, 0.9)';
  ctx.shadowBlur = (4 + 14 * pulse) * scale;
  ctx.strokeStyle = `rgba(231, 233, 240, ${0.8 + 0.2 * pulse})`;
  ctx.lineWidth = Math.max(1.2, 3 * scale);
  model.strokes.forEach(poly => {
    tracePolyline(ctx, poly, poly.total, size);
    ctx.stroke();
  });

  // Centelleo: destellos breves que se encienden y apagan cada uno a
  // su propio ritmo.
  ctx.shadowColor = 'rgba(255, 240, 200, 1)';
  ctx.shadowBlur = 8 * scale;
  ctx.fillStyle = '#fff6dc';
  model.sparkles.forEach(sp => {
    const p = sp.branch === undefined ? sp.point : tips[sp.branch];
    if (!p) return;
    if (sp.branch !== undefined && branchGrowth(model.branches[sp.branch], progress) < 0.5) return;
    const v = Math.pow(Math.max(0, Math.sin(time * sp.speed + sp.phase)), 16);
    if (v < 0.02) return;
    ctx.globalAlpha = v;
    ctx.beginPath();
    ctx.arc(p.x * size, p.y * size, (1 + 2.5 * v) * Math.max(0.6, scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.shadowBlur = 0;
}

// Ajusta la resolución interna de un canvas a su tamaño en pantalla
// (nítido en Retina). Solo lo redimensiona si cambió, así que se
// puede llamar en cada cuadro sin costo.
function fitCanvas(canvas) {
  const size = canvas.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  const px = Math.round(size * dpr);
  if (canvas.width !== px || canvas.height !== px) {
    canvas.width = px;
    canvas.height = px;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, size };
}

// --- Interfaz: tarjetas, vista ampliada, sembrar, borrar ------------

const liveGrid = document.getElementById('liveGrid');
const liveEmpty = document.getElementById('liveEmpty');
const liveOverlay = document.getElementById('liveOverlay');
const overlayCanvas = document.getElementById('overlayCanvas');

const liveCards = new Map(); // id -> { record, model, canvas, element, visible }
let overlayId = null;

// Solo se animan las tarjetas que están en pantalla.
const cardVisibility = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const card = liveCards.get(entry.target.dataset.id);
        if (card) card.visible = entry.isIntersecting;
      });
    })
  : null;

function updateLiveEmpty() {
  liveEmpty.style.display = liveSigils.length ? 'none' : '';
}

function addLiveCard(record) {
  const element = document.createElement('div');
  element.className = 'live-card';
  element.dataset.id = record.id;
  const canvas = document.createElement('canvas');
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', 'Sigilo vivo. Toca para ampliarlo.');
  const deleteBtn = document.createElement('button');
  deleteBtn.textContent = 'Borrar';
  element.append(canvas, deleteBtn);
  liveGrid.prepend(element);

  const card = { record, model: buildGrowthModel(record), canvas, element, visible: true };
  liveCards.set(record.id, card);
  if (cardVisibility) cardVisibility.observe(element);

  canvas.addEventListener('click', () => {
    overlayId = record.id;
    liveOverlay.hidden = false;
  });
  deleteBtn.addEventListener('click', () => {
    if (confirmByDoubleTap(deleteBtn, '¿Borrar? Toca de nuevo')) deleteLiveSigil(record.id);
  });
  updateLiveEmpty();
}

// Confirmación dentro de la página (no con confirm(), que algunos
// visores, como el de los artifacts de claude.ai, bloquean y responden
// siempre "no"): el primer toque cambia el texto del botón a una
// pregunta; solo un segundo toque en los 4 s siguientes confirma.
function confirmByDoubleTap(button, question) {
  if (button.dataset.armed === 'true') {
    clearTimeout(Number(button.dataset.timer));
    button.dataset.armed = 'false';
    button.textContent = button.dataset.label;
    return true;
  }
  button.dataset.label = button.textContent;
  button.dataset.armed = 'true';
  button.textContent = question;
  button.dataset.timer = String(setTimeout(() => {
    button.dataset.armed = 'false';
    button.textContent = button.dataset.label;
  }, 4000));
  return false;
}

// Borrado manual y definitivo: el ciclo lo cierra el usuario, nunca
// un temporizador.
function deleteLiveSigil(id) {
  liveSigils = liveSigils.filter(r => r.id !== id);
  saveLiveSigils();
  const card = liveCards.get(id);
  if (card) {
    if (cardVisibility) cardVisibility.unobserve(card.element);
    card.element.remove();
    liveCards.delete(id);
  }
  if (overlayId === id) closeOverlay();
  updateLiveEmpty();
}

function closeOverlay() {
  overlayId = null;
  liveOverlay.hidden = true;
}

liveOverlay.addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlayId) closeOverlay();
});

// Nacimiento: cierra el trazado de la combinación geometría+modo
// activa, hornea en la forma el giro/inversión que tenga en ese
// momento, y guarda SOLO id + hora + forma. Después borra todo el
// generador, incluidas las letras reducidas: lo último que quedaba
// de la frase.
function sowSigil() {
  const t = currentTransform();
  const round = v => Math.round(v * 10000) / 10000;
  const strokes = currentStrokes()
    .filter(s => s.length > 1)
    .map(s => s.map(p => {
      const q = toNormalizedPoint(applyTransform(toPixelPoint(p), t));
      return { x: round(q.x), y: round(q.y) };
    }));
  if (strokes.length === 0) return;
  if (!confirmByDoubleTap(sowBtn, '¿Sembrar? Ya no se podrá editar. Toca de nuevo')) return;

  let id;
  do { id = randomId(); } while (liveSigils.some(r => r.id === id));
  const record = { id, bornAt: Date.now(), strokes };

  liveSigils.push(record);
  if (!saveLiveSigils()) {
    liveSigils.pop();
    hintText.textContent = 'No se pudo guardar el sigilo en este navegador.';
    return;
  }
  resetAll();
  addLiveCard(record);
  hintText.textContent = 'Sigilo sembrado. Ya está creciendo.';
}

sowBtn.addEventListener('click', sowSigil);

// Un solo bucle de animación para todos los sigilos. El navegador lo
// pausa solo cuando la pestaña no está visible; al volver, la
// madurez se recalcula desde la hora de nacimiento, así que el
// sigilo aparece directamente donde le corresponde.
function animateLiveSigils() {
  const now = Date.now();
  const time = performance.now() / 1000;
  liveCards.forEach(card => {
    if (!card.visible || overlayId) return;
    const { ctx, size } = fitCanvas(card.canvas);
    drawLiveSigil(ctx, size, card.model, maturity(card.record, now), time);
  });
  const overlayCard = overlayId && liveCards.get(overlayId);
  if (overlayCard) {
    const { ctx, size } = fitCanvas(overlayCanvas);
    drawLiveSigil(ctx, size, overlayCard.model, maturity(overlayCard.record, now), time);
  }
  requestAnimationFrame(animateLiveSigils);
}

// ---------------------------------------------------------------
// 5. ARRANQUE
// ---------------------------------------------------------------

// Como los trazos se guardan normalizados (ver toNormalizedPoint),
// un cambio de tamaño ya no necesita borrar nada: solo recalculamos
// las medidas del canvas y volvemos a dibujar todo (fondo + trazo)
// escalado al tamaño nuevo.
window.addEventListener('resize', () => {
  resizeCanvases();
  drawBackground();
  redrawStrokes();
});

resizeCanvases();
drawBackground();

// Los más antiguos primero: addLiveCard() pone cada uno arriba, así
// que el más reciente queda al principio de la grilla.
liveSigils = loadLiveSigils();
liveSigils.forEach(addLiveCard);
updateLiveEmpty();
requestAnimationFrame(animateLiveSigils);
</script>
</body>
