<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Generador de sigilos</title>
<style>
:root {
  --bg: #0b0d14;
  --panel: #12151f;
  --border: #262b3a;
  --text: #e7e9f0;
  --muted: #8a90a6;
  --accent: #c9a24b;
  --accent-dim: rgba(201, 162, 75, 0.35);
  --danger: #d16464;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* evita que el navegador haga scroll/bounce mientras se dibuja en el canvas */
  overscroll-behavior: none;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

h1 {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 4px;
  letter-spacing: 0.02em;
}

.subtitle {
  color: var(--muted);
  font-size: 0.85rem;
  margin: 0 0 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 8px;
}

textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  background: #0d1018;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  padding: 10px;
  font-family: inherit;
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  font-family: inherit;
  font-size: 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #1a1e2b;
  color: var(--text);
  padding: 10px 14px;
  cursor: pointer;
}

button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1608;
  font-weight: 600;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

button[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mode-select {
  display: flex;
  gap: 10px;
}

.mode-option {
  flex: 1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  background: #0d1018;
}

.mode-option.active {
  border-color: var(--accent);
  background: rgba(201, 162, 75, 0.08);
}

.mode-option input {
  margin-top: 3px;
}

.mode-option .label {
  font-size: 0.85rem;
  font-weight: 600;
}

.mode-option .desc {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}

.letters-readout {
  font-size: 0.95rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  min-height: 1.2em;
}

.letters-readout .empty {
  color: var(--muted);
  letter-spacing: normal;
  font-style: italic;
}

.canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: #0d1018;
  border: 1px solid var(--border);
  touch-action: none;
}

.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#drawCanvas {
  cursor: crosshair;
}

.hint {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 10px;
  text-align: center;
}
</style>
</head>
<body>
<div class="app">
  <h1>Generador de sigilos</h1>
  <p class="subtitle">Escribe una frase o intención, redúcela a su forma simbólica y trázala.</p>

  <div class="panel">
    <label for="phraseInput">Frase o intención</label>
    <textarea id="phraseInput" placeholder="Ej: Confío en mi propio criterio"></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="generateBtn" class="primary">Generar sigilo</button>
    </div>
  </div>

  <div class="panel">
    <label>Letras reducidas</label>
    <div id="lettersReadout" class="letters-readout"><span class="empty">— genera un sigilo para ver las letras —</span></div>
  </div>

  <div class="panel">
    <label>Modo de trazo</label>
    <div class="mode-select">
      <label class="mode-option" id="modeGuiadoOption">
        <input type="radio" name="mode" value="guiado" checked>
        <span>
          <span class="label">Guiado</span>
          <span class="desc">Puntos numerados y línea tenue de referencia.</span>
        </span>
      </label>
      <label class="mode-option" id="modeLibreOption">
        <input type="radio" name="mode" value="libre">
        <span>
          <span class="label">Libre</span>
          <span class="desc">Solo los puntos como referencia, tú trazas.</span>
        </span>
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="bgCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
    <p class="hint" id="hintText">Genera un sigilo para empezar a trazar.</p>
    <div class="row" style="margin-top:10px;">
      <button id="revealBtn" style="display:none;">Visualizar sigilo</button>
      <button id="undoBtn" disabled>Deshacer</button>
      <button id="clearStrokeBtn">Limpiar trazo</button>
      <button id="resetBtn">Reiniciar todo</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// 1. ALFABETO Y ALGORITMO DE REDUCCIÓN
// ---------------------------------------------------------------

// Las 27 letras del alfabeto español (RAE), en orden, con la Ñ
// como letra propia entre la N y la O.
const ALPHABET = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Ñ',
                   'O','P','Q','R','S','T','U','V','W','X','Y','Z'];

const VOWELS = new Set(['A', 'E', 'I', 'O', 'U']);

// Convierte una frase en la secuencia de consonantes únicas que
// forman el sigilo, en el orden en que aparecen.
function reduceToSigil(text) {
  // 1) Mayúsculas.
  let s = text.toUpperCase();

  // 2) Quitar tildes SIN tocar la Ñ.
  //    normalize('NFD') separa "É" en "E" + acento combinante, lo cual
  //    nos permite borrar el acento con una regex. El problema es que
  //    también separaría "Ñ" en "N" + tilde combinante, y perderíamos
  //    la diferencia entre N y Ñ. Por eso la protegemos primero con un
  //    carácter que no va a aparecer nunca en el texto normal.
  const GUARD = '\u0000';
  s = s.replace(/Ñ/g, GUARD);
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); // quita acentos
  s = s.replace(new RegExp(GUARD, 'g'), 'Ñ');

  // 3) Quedarnos solo con letras válidas (descarta espacios, números,
  //    signos de puntuación, etc).
  s = s.replace(/[^A-ZÑ]/g, '');

  // 4) Quitar las vocales.
  const consonants = [...s].filter(ch => !VOWELS.has(ch));

  // 5) De las consonantes que quedan, conservar solo la primera
  //    aparición de cada una.
  const seen = new Set();
  const result = [];
  for (const ch of consonants) {
    if (!seen.has(ch)) {
      seen.add(ch);
      result.push(ch);
    }
  }
  return result;
}

// ---------------------------------------------------------------
// 2. GEOMETRÍA DE LA RUEDA
// ---------------------------------------------------------------

// Elementos y estado del canvas. Los canvases son cuadrados y su
// tamaño en píxeles reales se recalcula en resizeCanvases() para que
// se vean nítidos también en pantallas de alta densidad (Retina/iPad).
const canvasWrap = document.getElementById('canvasWrap');
const bgCanvas = document.getElementById('bgCanvas');
const drawCanvas = document.getElementById('drawCanvas');
const bgCtx = bgCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

let wheelCenter = { x: 0, y: 0 };
let wheelRadius = 0;
let letterPositions = {}; // { 'A': {x, y}, 'B': {x, y}, ... }
let currentLetters = [];  // resultado de reduceToSigil(), letras en orden

// Ajusta la resolución interna del canvas a su tamaño real en
// pantalla * devicePixelRatio, para que las líneas no se vean
// borrosas en pantallas retina. Sin esto, un canvas de 300x300 CSS
// pero dibujado a 300x300 px reales se ve pixelado en un iPad.
function resizeCanvases() {
  const size = canvasWrap.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  [bgCanvas, drawCanvas].forEach(canvas => {
    canvas.width = size * dpr;
    canvas.height = size * dpr;
  });
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  wheelCenter = { x: size / 2, y: size / 2 };
  wheelRadius = size * 0.38;
  letterPositions = computeLetterPositions(wheelCenter, wheelRadius);
}

// Distribuye las 27 letras en círculo, empezando por A en la parte
// superior (las 12 en punto) y avanzando en sentido horario.
//
// Cada letra guarda dos coordenadas distintas:
//   - point: el punto exacto SOBRE el círculo. Es el que se usa para
//     el sigilo (líneas, numeración, trazo de referencia).
//   - label: un poco más afuera del círculo. Es solo para que el
//     texto de la letra no tape su propio punto.
function computeLetterPositions(center, radius) {
  const positions = {};
  const n = ALPHABET.length;
  const labelRadius = radius + 20;
  ALPHABET.forEach((letter, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    positions[letter] = {
      point: {
        x: center.x + radius * Math.cos(angle),
        y: center.y + radius * Math.sin(angle),
      },
      label: {
        x: center.x + labelRadius * Math.cos(angle),
        y: center.y + labelRadius * Math.sin(angle),
      },
    };
  });
  return positions;
}

// Dibuja el fondo: el círculo guía, las 27 letras del alfabeto, y
// (si ya hay un sigilo generado) los puntos que le corresponden,
// con numeración y línea tenue solo cuando el modo es "guiado".
function drawBackground() {
  const size = canvasWrap.clientWidth;
  bgCtx.clearRect(0, 0, size, size);

  // Círculo guía.
  bgCtx.beginPath();
  bgCtx.arc(wheelCenter.x, wheelCenter.y, wheelRadius, 0, Math.PI * 2);
  bgCtx.strokeStyle = '#262b3a';
  bgCtx.lineWidth = 1;
  bgCtx.stroke();

  // Las 27 letras, como referencia de fondo.
  bgCtx.font = '13px -apple-system, sans-serif';
  bgCtx.textAlign = 'center';
  bgCtx.textBaseline = 'middle';
  ALPHABET.forEach(letter => {
    const { point, label } = letterPositions[letter];
    // Con "Visualizar sigilo" activo, tratamos la rueda como si
    // ningún punto estuviera marcado: así desaparece el resaltado
    // dorado y solo queda tu trazo (que vive en el otro canvas).
    const isActive = !sigilRevealed && currentLetters.includes(letter);

    // Etiqueta con el nombre de la letra, un poco afuera del círculo.
    bgCtx.fillStyle = isActive ? '#c9a24b' : '#4a5066';
    bgCtx.fillText(letter, label.x, label.y);

    // Punto exacto sobre el círculo: es la posición real que usa el sigilo.
    bgCtx.beginPath();
    bgCtx.arc(point.x, point.y, isActive ? 3.5 : 1.5, 0, Math.PI * 2);
    bgCtx.fillStyle = isActive ? '#c9a24b' : '#333a4d';
    bgCtx.fill();
  });

  if (currentLetters.length === 0) return;

  const mode = getSelectedMode();

  if (mode === 'guiado' && !sigilRevealed) {
    // Línea tenue conectando los puntos en el orden de la reducción.
    bgCtx.beginPath();
    currentLetters.forEach((letter, i) => {
      const { point } = letterPositions[letter];
      if (i === 0) bgCtx.moveTo(point.x, point.y);
      else bgCtx.lineTo(point.x, point.y);
    });
    bgCtx.strokeStyle = 'rgba(201, 162, 75, 0.35)';
    bgCtx.lineWidth = 1.5;
    bgCtx.stroke();

    // Número de orden junto a cada punto.
    currentLetters.forEach((letter, i) => {
      const { point } = letterPositions[letter];
      bgCtx.fillStyle = '#e7e9f0';
      bgCtx.font = '11px -apple-system, sans-serif';
      bgCtx.fillText(String(i + 1), point.x + 10, point.y - 10);
    });
  }
  // En modo "libre" no se dibuja línea ni números: los puntos
  // (ya marcados arriba como isActive) quedan como única referencia.
}

// ---------------------------------------------------------------
// 3. CONTROLES: generar sigilo, elegir modo, limpiar
// ---------------------------------------------------------------

const phraseInput = document.getElementById('phraseInput');
const generateBtn = document.getElementById('generateBtn');
const lettersReadout = document.getElementById('lettersReadout');
const modeInputs = document.querySelectorAll('input[name="mode"]');
const modeGuiadoOption = document.getElementById('modeGuiadoOption');
const modeLibreOption = document.getElementById('modeLibreOption');
const revealBtn = document.getElementById('revealBtn');
const undoBtn = document.getElementById('undoBtn');
const clearStrokeBtn = document.getElementById('clearStrokeBtn');
const resetBtn = document.getElementById('resetBtn');
const hintText = document.getElementById('hintText');

// true mientras el usuario pidió "ver el sigilo limpio": oculta el
// resaltado de puntos, la numeración y la línea guía en la rueda de
// fondo. Solo tiene sentido en modo guiado (en libre nunca se
// dibujan esos elementos, así que no hay nada que ocultar).
let sigilRevealed = false;

// true en cuanto el usuario apoya el dedo/lápiz por primera vez sobre
// el trazo. Mientras sea true, bloqueamos el cambio de modo: el
// requisito es poder elegir el modo *antes* de empezar a trazar, no
// a mitad de un trazo.
let hasStartedDrawing = false;

// Cada trazo completo (desde que apoyás el dedo hasta que lo
// levantás) se guarda como una lista de puntos, no solo como
// píxeles ya pintados. Así "Deshacer" puede quitar el último trazo
// y volver a dibujar únicamente los anteriores.
let strokes = [];

function updateUndoButton() {
  undoBtn.disabled = strokes.length === 0;
}

// El botón "Visualizar sigilo" solo aparece en modo guiado y una vez
// que hay un sigilo generado (en libre no hay nada que "limpiar": la
// rueda ya se muestra sin números ni línea).
function updateRevealButton() {
  const showButton = getSelectedMode() === 'guiado' && currentLetters.length > 0;
  revealBtn.style.display = showButton ? '' : 'none';
  revealBtn.textContent = sigilRevealed ? 'Mostrar guía' : 'Visualizar sigilo';
  revealBtn.setAttribute('aria-pressed', String(sigilRevealed));
}

function getSelectedMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function updateModeOptionStyles() {
  const mode = getSelectedMode();
  modeGuiadoOption.classList.toggle('active', mode === 'guiado');
  modeLibreOption.classList.toggle('active', mode === 'libre');
}

function setModeLocked(locked) {
  modeInputs.forEach(input => { input.disabled = locked; });
  modeGuiadoOption.style.opacity = locked ? '0.5' : '1';
  modeLibreOption.style.opacity = locked ? '0.5' : '1';
}

function renderLettersReadout() {
  if (currentLetters.length === 0) {
    lettersReadout.innerHTML = '<span class="empty">— genera un sigilo para ver las letras —</span>';
  } else {
    lettersReadout.textContent = currentLetters.join(' · ');
  }
}

function generateSigil() {
  currentLetters = reduceToSigil(phraseInput.value);
  hasStartedDrawing = false;
  setModeLocked(false);
  strokes = [];
  sigilRevealed = false;
  clearDrawing();
  updateUndoButton();
  updateRevealButton();
  renderLettersReadout();
  drawBackground();
  hintText.textContent = currentLetters.length
    ? 'Traza el sigilo con el dedo o el lápiz sobre el canvas.'
    : 'La frase no produjo ninguna consonante utilizable. Prueba con otra.';
}

// Borra solo lo que se ve en el canvas de dibujo. No toca `strokes`:
// quien llama decide si también hay que olvidar el historial.
function clearDrawing() {
  const size = canvasWrap.clientWidth;
  drawCtx.clearRect(0, 0, size, size);
}

// Vuelve a pintar, desde cero, todos los trazos guardados en
// `strokes`. Se usa después de deshacer, para que el dibujo en
// pantalla coincida con el nuevo historial (sin el último trazo).
function redrawStrokes() {
  clearDrawing();
  strokes.forEach(points => {
    if (points.length < 2) return;
    drawCtx.beginPath();
    drawCtx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      drawCtx.lineTo(points[i].x, points[i].y);
    }
    drawCtx.strokeStyle = '#e7e9f0';
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    drawCtx.stroke();
  });
}

generateBtn.addEventListener('click', generateSigil);

modeInputs.forEach(input => {
  input.addEventListener('change', () => {
    updateModeOptionStyles();
    // Al cambiar de modo volvemos a mostrar la guía por defecto: no
    // tendría sentido llegar a libre con el sigilo "revelado".
    sigilRevealed = false;
    updateRevealButton();
    drawBackground();
  });
});

revealBtn.addEventListener('click', () => {
  sigilRevealed = !sigilRevealed;
  updateRevealButton();
  drawBackground();
});

undoBtn.addEventListener('click', () => {
  if (strokes.length === 0) return;
  strokes.pop();
  redrawStrokes();
  updateUndoButton();
  if (strokes.length === 0) {
    // Volvimos al estado inicial: se puede elegir modo de nuevo.
    hasStartedDrawing = false;
    setModeLocked(false);
  }
});

clearStrokeBtn.addEventListener('click', () => {
  strokes = [];
  clearDrawing();
  updateUndoButton();
  hasStartedDrawing = false;
  setModeLocked(false);
});

resetBtn.addEventListener('click', () => {
  phraseInput.value = '';
  currentLetters = [];
  strokes = [];
  sigilRevealed = false;
  hasStartedDrawing = false;
  setModeLocked(false);
  clearDrawing();
  updateUndoButton();
  updateRevealButton();
  renderLettersReadout();
  drawBackground();
  hintText.textContent = 'Genera un sigilo para empezar a trazar.';
});

updateModeOptionStyles();
updateRevealButton();

// ---------------------------------------------------------------
// 4. DIBUJO A MANO: Pointer Events (mouse, dedo y lápiz)
// ---------------------------------------------------------------

let isDrawing = false;
let lastPoint = null;
let currentStrokePoints = null; // puntos del trazo que se está dibujando ahora mismo

// Convierte las coordenadas del evento (relativas a la ventana) a
// coordenadas relativas al canvas.
function pointerToCanvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

drawCanvas.addEventListener('pointerdown', (e) => {
  if (currentLetters.length === 0) return; // nada que trazar todavía

  isDrawing = true;
  hasStartedDrawing = true;
  setModeLocked(true); // ya no se puede cambiar de modo a mitad de trazo

  // Captura el puntero: los siguientes eventos "move"/"up" llegan a
  // este elemento aunque el dedo se salga del canvas, evitando
  // trazos que se cortan en el borde.
  drawCanvas.setPointerCapture(e.pointerId);

  lastPoint = pointerToCanvasPos(e);
  currentStrokePoints = [lastPoint];
  e.preventDefault();
});

drawCanvas.addEventListener('pointermove', (e) => {
  if (!isDrawing) return;

  // Fundamental para iPad/Safari: sin esto, el navegador puede
  // interpretar el arrastre como un gesto de scroll o navegación
  // aunque touch-action:none ya esté puesto en el CSS.
  e.preventDefault();

  const point = pointerToCanvasPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(lastPoint.x, lastPoint.y);
  drawCtx.lineTo(point.x, point.y);
  drawCtx.strokeStyle = '#e7e9f0';
  drawCtx.lineWidth = 3;
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.stroke();
  lastPoint = point;
  currentStrokePoints.push(point);
});

function stopDrawing(e) {
  if (!isDrawing) return;
  isDrawing = false;
  lastPoint = null;

  // Guardamos el trazo completo en el historial para que "Deshacer"
  // pueda quitarlo más tarde. Un solo punto (un toque sin arrastrar)
  // no dibuja ninguna línea, así que no vale la pena guardarlo.
  if (currentStrokePoints && currentStrokePoints.length > 1) {
    strokes.push(currentStrokePoints);
    updateUndoButton();
  }
  currentStrokePoints = null;
}

drawCanvas.addEventListener('pointerup', stopDrawing);
drawCanvas.addEventListener('pointercancel', stopDrawing);
drawCanvas.addEventListener('pointerleave', stopDrawing);

// ---------------------------------------------------------------
// 5. ARRANQUE
// ---------------------------------------------------------------

window.addEventListener('resize', () => {
  resizeCanvases();
  drawBackground();
  // El trazo no sobrevive a un cambio de tamaño: sus coordenadas
  // quedarían desalineadas respecto a la nueva rueda.
  strokes = [];
  clearDrawing();
  updateUndoButton();
});

resizeCanvases();
drawBackground();
</script>
</body>
</html>
